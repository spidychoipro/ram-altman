name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = '1.1.0'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build and test
        shell: pwsh
        run: ./windows/build.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ram-altman-windows
          path: |
            dist/ram-altman.exe
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ram-altman.exe
            dist/*.msi
            dist/*.zip
          generate_release_notes: true
