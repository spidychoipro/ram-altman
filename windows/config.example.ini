# Ram Altman for Windows - sample configuration
#
# Copy this file to %LOCALAPPDATA%\ram-altman\config.ini and fill in the
# addresses. Every value can also be supplied with a RAM_ALTMAN_* environment
# variable, which wins over the file. Set RAM_ALTMAN_CONFIG to point at a
# different file.
#
# Lines starting with # or ; are ignored. Values may be quoted.

to = recipient@example.com
from = you@example.com
fromName = Your Name

# Email when available RAM is above this percentage (whole number).
threshold = 10

# Where usage.csv, last_sent and the joke rotation live.
# Default: %LOCALAPPDATA%\ram-altman
# statedir = C:\Users\you\AppData\Local\ram-altman

# ----- SMTP -----------------------------------------------------------------
# Used when sendmail and outbox are both empty.
smtpHost = smtp.example.com
smtpPort = 587
smtpUser = you@example.com
smtpTls = true

# Do not put a real password in a file you might share. Either set
# RAM_ALTMAN_SMTP_PASSWORD in your environment, or uncomment this line:
# smtpPassword = app-password

# ----- or a sendmail-compatible command -------------------------------------
# The whole RFC 822 message is written to the command's standard input.
# Quoting works like cmd.exe: "C:\path with spaces\msmtp.exe" -t
# sendmail = "C:\msys64\usr\bin\msmtp.exe" -t

# ----- or just write the email to a file ------------------------------------
# Handy for testing, and the only transport --dry-run never needs.
# outbox = %LOCALAPPDATA%\Temp\ram-altman.eml
